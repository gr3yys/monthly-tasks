<script>

<div><span class="lbl">Recibidas</span>${stp(i,"r",r.r,r.t)}</div><div><span class="lbl">Completadas</span>${stp(i,"c",r.c,r.t)}</div>

<div class="kpis"><div class="kpi"><span>Recibidas</span><b id="kR">${R}</b></div><div class="kpi"><span>Completadas</span><b id="kC" style="color:var(--ok)">${C}</b></div><div class="kpi"><span>Pendientes</span><b id="kP" style="color:var(--wr)">${R-C}</b></div><div class="kpi"><span>Cumplimiento general</span><b id="kT">${R?rate+"%":"—"}</b></div></div>${rq}</section>
<section class="card pad"><div class="row between"><div><h2>Objetivos del periodo</h2><p class="mu">Escriba una tarea por línea. Cada línea aparecerá como viñeta en el informe Word.</p></div><span class="chip ok" id="ns">Guardado ✓</span></div>
<textarea rows="4" style="margin-top:12px" aria-label="Objetivos del periodo" placeholder="Ej.: Certificación de inventario pre-cierre." oninput="noteIn(this.value)">${esc(d.notes)}</textarea></section>
<section><div class="row between" style="margin-bottom:12px"><div><h2>Tareas mensuales</h2><p class="mu">Arrastre las tarjetas o haga clic en una para editarla. Las completadas se incluyen en el informe.</p></div><button class="btn pri" onclick="taskDlg()">+ Nueva tarea</button></div><div class="board"><div class="kb">${cards}</div></div></section>`}
function rv(r){const p=r.r?Math.round(r.c/r.r*100):0,pe=r.r-r.c;return{p,pe,cl:!r.r?"":p>=90?"ok":p>=75?"wr":"er",tx:pe>0?pe+" pendiente"+(pe>1?"s":""):r.r?"Al día":"Sin solicitudes"}}
function stp(i,f,v,t){const id=(f==="r"?"ir":"ic")+i,n=f==="r"?"Recibidas":"Completadas";return`<span class="stp"><button aria-label="Restar ${n.toLowerCase()}: ${esc(t)}" onclick="bump(${i},'${f}',-1)">−</button><input type="number" min="0" inputmode="numeric" id="${id}" value="${v}" aria-label="${n}: ${esc(t)}" onfocus="this.select()" onchange="setReq(${i},'${f}',this.value)"><button aria-label="Sumar ${n.toLowerCase()}: ${esc(t)}" onclick="bump(${i},'${f}',1)">+</button></span>`}
function setReq(i,f,v){const r=D().req[i];r[f]=Math.max(0,parseInt(v)||0);if(r.c>r.r)r.c=r.r;save();paint()}
function bump(i,f,n){setReq(i,f,D().req[i][f]+n)}
function paint(){const d=D();let R=0,C=0;d.req.forEach((r,i)=>{R+=r.r;C+=r.c;const v=rv(r),c=$("#pc"+i);$("#bar"+i).style.width=v.p+"%";c.className="chip "+v.cl;c.textContent=r.r?v.p+"%":"—";$("#pe"+i).textContent=v.tx;$("#ir"+i).value=r.r;$("#ic"+i).value=r.c});$("#kR").textContent=R;$("#kC").textContent=C;$("#kP").textContent=R-C;$("#kT").textContent=R?Math.round(C/R*100)+"%":"—"}
let nt;function noteIn(v){D().notes=v;save();$("#ns").textContent="Guardando…";clearTimeout(nt);nt=setTimeout(()=>{const e=$("#ns");if(e)e.textContent="Guardado ✓"},500)}
function card(t){const dn=t.col==="done",od=t.du&&t.du<today()&&!dn,dt=dn?(t.cd||t.du||t.s):t.s;
return`<article class="tk" role="button" tabindex="0" draggable="true" aria-label="Editar tarea: ${esc(t.t)}" onclick="taskDlg('${t.id}')" onkeydown="if(event.key==='Enter')taskDlg('${t.id}')" ondragstart="event.dataTransfer.setData('text/plain','${t.id}')"><div class="meta"><span class="chip cat">${esc(t.cat)}</span>${t.pr==="H"?'<span class="chip er">Alta</span>':""}</div><div class="tt">${esc(t.t)}</div><div class="meta">${dt?`<span class="dt ${dn?"ok":od?"er":""}"${od?' title="Tarea vencida"':""}>${dn?I.check:I.clock} ${sh(dt)}</span>`:"<span></span>"}${t.d?`<span class="mi" title="Con detalles">${I.lines}</span>`:""}</div></article>`}
function mv(id,c){const t=D().tasks.find(x=>x.id===id);if(!t)return;t.col=c;t.cd=c==="done"?(t.cd||today()):"";save();render()}
function drop(e,c){e.preventDefault();mv(e.dataTransfer.getData("text/plain"),c)}

/* ---------- Calendario Mensual (Estilo Jira con altura fija y sin deformarse) ---------- */
function calendarView(){
    const d=D();
    const y=cy.y, m=cy.m;
    const firstDayIndexRaw = new Date(y, m, 1).getDay();
    const firstDayIndex = (firstDayIndexRaw === 0) ? 6 : firstDayIndexRaw - 1;
    
    const totalDays = new Date(y, m + 1, 0).getDate();
    const prevDays = new Date(y, m, 0).getDate();
    const tod = today();

    let cellsHtml="";
    for(let i=firstDayIndex; i>0; i--){
        const dayNum = prevDays - i + 1;
        cellsHtml += `<div class="cal-cell other"><span class="cal-day-num">${dayNum}</span></div>`;
    }

    for(let day=1; day<=totalDays; day++){
        const dateStr = y + "-" + pad(m+1) + "-" + pad(day);
        const isToday = (dateStr === tod);
        
        const dayTasks = d.tasks.filter(t => t.s === dateStr || t.du === dateStr);
        const dayEvents = (d.events || []).filter(e => e.d === dateStr);

        let evsHtml = "";
        dayEvents.forEach(ev => {
            evsHtml += `<div class="cal-ev event-ev" onclick="event.stopPropagation(); eventDlg('${ev.id}')" title="Evento: ${esc(ev.t)}">📌 ${esc(ev.t)}</div>`;
        });
        dayTasks.forEach(tk => {
            const isDue = tk.du === dateStr;
            evsHtml += `<div class="cal-ev task-ev" onclick="event.stopPropagation(); taskDlg('${tk.id}')" title="Tarea: ${esc(tk.t)}">${isDue?"🏁 ":"🚀 "}${esc(tk.t)}</div>`;
        });

        cellsHtml += `<div class="cal-cell ${isToday?"today":""}" onclick="taskDlg(null, 'todo', '${dateStr}')"><span class="cal-day-num">${day}</span><div class="cal-events">${evsHtml}</div></div>`;
    }

    const totalCellsPainted = firstDayIndex + totalDays;
    const nextDaysCount = totalCellsPainted <= 35 ? 35 - totalCellsPainted : 42 - totalCellsPainted;
    for(let day=1; day<=nextDaysCount; day++){
        cellsHtml += `<div class="cal-cell other"><span class="cal-day-num">${day}</span></div>`;
    }

    return `<section class="card pad">
        <div class="row between">
            <div><h2>Calendario Mensual</h2><p class="mu">Haga clic en cualquier celda de fecha para añadir una tarea de forma instantánea en ese día.</p></div>
            <div class="row"><button class="btn pri sm" onclick="eventDlg()">+ Nuevo evento</button><button class="btn sm" onclick="taskDlg(null, 'todo', '${today()}')">+ Nueva tarea</button></div>
        </div>
        <div class="cal-grid">
            <div class="cal-head">Lun</div><div class="cal-head">Mar</div><div class="cal-head">Mié</div><div class="cal-head">Jue</div><div class="cal-head">Vie</div><div class="cal-head">Sáb</div><div class="cal-head">Dom</div>
            ${cellsHtml}
        </div>
    </section>`;
}

function rows(){const p=D()[ph],n=p.c.length,rc=p.c.filter(c=>c.rec).length,pct=n?Math.round(rc/n*100):0,ct=s=>p.c.filter(c=>c.rec&&c.st===s).length;

<td><select class="sel s s-${c.st.split(" ").pop()==="Evaluado"?"":c.st.split(" ").pop()}" aria-label="Estatus" onchange="setSt(${i},this.value)">${ST.map(s=>`<option ${s===c.st?"selected":""}>${s}</option>`).join("")}</select></td>
